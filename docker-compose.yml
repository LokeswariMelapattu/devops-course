version: "3.8"

services:
  service1:
    build: ./service1
    ports:
      - "8199:8080"
    volumes:
      - ./vstorage:/app/vstorage
    networks:
      - services_network
    depends_on:
      - service2
      - storage
      
  service2:
    build: ./service2
    volumes:
      - ./vstorage:/app/vstorage
    networks:
      - services_network
    depends_on:
      - storage
  storage:
    build: ./storage
    networks:
      - services_network
    
volumes:
  vStorage: {}

networks:
  services_network:
    driver: bridge
